name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Quality gates added under the engineering standards (M/N/P). These are
      # advisory (continue-on-error) for now; flip to blocking once baselines
      # are clean. See docs/engineering_standards.md sections M and N.
      - name: Type check (advisory)
        continue-on-error: true
        run: uv run mypy src

      - name: Pytest with coverage
        run: uv run pytest -q --cov=etf_portfolio --cov-report=xml --cov-report=term

      - name: Dependency vulnerability audit (advisory)
        continue-on-error: true
        run: uv run pip-audit

      - name: Upload coverage report
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4.4.3
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
